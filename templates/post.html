<!DOCTYPE html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <title>{{.Title}}</title>
    <meta name="description" content="{{.Description}}" />
  </head>
  <body>
	<header>
		<a href="/">Rituraj Borpujari</a>
	</header>
    <main>
      <h1>{{.Title}}</h1>
      <span>{{.Date}}</span>
      <article>{{.Content}}</article>
    </main>

	<footer>
		<small>Powered by Bob</small>
	</footer>
  </body>
  <style>
    html {
      font-size: 14pt;
      font-family: sans-serif;
    }
    body {
      margin: 0 auto;
      max-width: 1024px;
      padding: 16px;
    }
    header {
      padding: 16px 0;
      box-shadow: 0 1px 0 #ddd;
    }
    table {
      border: collapse;
    }
    table th {
      background-color: #282828;
      color: #d0d0d0;
    }
    td,th {
      padding: 4px 8px;
      border: 1px solid #ddd;
    }
    pre {
      background-color: #282829;
      padding: 16px;
      border-radius: 4px;
	  font-family: monospace;
	  font-size: 12pt;
    }
    code {
      color: #dd2222;
    }
    pre code {
      color: #d0d0d0;
    }
	footer {
		text-align: center;
		padding: 8px;
		color: #666;
		font-size: 10pt;
	}
  </style>
</html>
